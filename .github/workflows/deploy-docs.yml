name: Deploy docs

# The docs live in dash14/v-network-graph-docs and are served from this repository's Pages,
# which only a workflow of this repository can deploy to.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Deploy must be dispatched from main; github.ref is $REF"
          exit 1

      - name: Checkout the docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dash14/v-network-graph-docs
          persist-credentials: false

      # Takes the version from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Takes the version from devEngines.runtime in package.json.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # No cache, so what gets deployed never depends on a cache another run saved.
      # Buildcage keeps the build to packages and the Node.js that devEngines pins.
      - name: Build the site
        uses: buildcage/isolated-run@e17dbc9c53e03b39835b2f3e11834243d90aa183 # v2.5.0
        with:
          proxy-mode: restrict
          allowed-url-rules: |
            GET|HEAD https://registry.npmjs.org/**
            GET https://nodejs.org/download/release/**
          run: |
            pnpm install --frozen-lockfile
            pnpm run docs:build

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Longer than the 10 minutes deploy-pages waits, so it fails with its own error.
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
