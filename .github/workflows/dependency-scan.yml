name: Dependency Vulnerability Scan
run-name: Dependency Vulnerability Scan (${{ github.ref_name }})

on:
  schedule:
    # Every Saturday at 00:00 UTC
    - cron: "0 0 * * 6"
  push:
    branches: [main]
    paths: [pnpm-lock.yaml]
  workflow_dispatch:

permissions: {}

jobs:
  # GitHub's dependency graph reads only the first document of pnpm's lockfile,
  # pnpm's own entry, so Dependabot never sees the npm dependencies. OSV-Scanner
  # reads the rest from v2.6.0 on; earlier versions scan pnpm alone and pass.
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
