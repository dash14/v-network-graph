engineStrict: true

minimumReleaseAge: 20160 # 2 weeks
minimumReleaseAgeExclude:
  # Fixes query strings leaking into preserveModules file names
  - rolldown@1.2.13
  - "@rolldown/binding-*" # rolldown pins these to its own version
  - "@oxc-project/types@0.153.0"
  - "@dash14/svg-pan-zoom" # Our own fork, released from its own reviewed workflow

trustPolicy: no-downgrade

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lefthook: false
