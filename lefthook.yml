pre-commit:
  jobs:
    - name: lint
      glob: "*.{js,mjs,cjs,ts,mts,cts,vue}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

    # Oxlint cannot lint Vue templates yet.
    - name: lint vue templates
      glob: "*.vue"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    # Oxlint has no rule to keep node positions read through positionOf.
    - name: lint node position reads
      # The default matcher needs a directory for each **, so files right under src are listed too.
      glob: ["src/*.ts", "src/**/*.ts"]
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: format
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
