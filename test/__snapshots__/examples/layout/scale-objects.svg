<svg class="v-ng-canvas show touches" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events" style="overflow: hidden; ">
  <g class="v-ng-viewport svg-pan-zoom_viewport" transform="matrix(1.5 0 0 1.5 0 0)">
    <g class="v-ng-layer-edges v-ng-graph-objects">
      <line class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" x1="0" y1="0" x2="50" y2="50" />
      <line class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" x1="50" y1="50" x2="100" y2="0" />
      <line class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" x1="100" y1="0" x2="150" y2="50" />
      <line class="v-ng-line v-ng-edge" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge1" x1="0" y1="0" x2="50" y2="50" />
      <line class="v-ng-line v-ng-edge" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge2" x1="50" y1="50" x2="100" y2="0" />
      <line class="v-ng-line v-ng-edge" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge3" x1="100" y1="0" x2="150" y2="50" />
    </g>
    <g class="v-ng-layer-nodes-selections" />
    <g class="v-ng-layer-nodes v-ng-graph-objects">
      <g class="v-ng-node" transform="translate(0 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(50 50)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(100 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(150 50)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
    </g>
    <g class="v-ng-layer-node-labels v-ng-graph-objects">
      <g class="v-ng-node-label" transform="translate(0 0)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 1
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(50 50)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 2
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(100 0)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 3
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(150 50)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 4
        </text>
      </g>
    </g>
  </g>
</svg>