<svg class="v-ng-canvas show touches" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events" style="overflow: hidden; ">
  <g class="v-ng-viewport svg-pan-zoom_viewport" transform="matrix(1 0 0 1 0 0)">
    <g class="v-ng-layer-edges v-ng-graph-objects">
      <path class="v-ng-line-background" stroke="transparent" stroke-width="11" fill="none" d="M 0 0 L 80 80" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="11" fill="none" d="M 80 80 L 160 0" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="11" fill="none" d="M 160 0 L 240 80" />
      <path class="v-ng-line v-ng-edge" stroke="#666666" stroke-width="1" stroke-linecap="butt" data-edge-id="edge1" d="M 0 0 L 80 80" />
      <path class="v-ng-line v-ng-edge" stroke="#666666" stroke-width="1" stroke-linecap="butt" data-edge-id="edge2" d="M 80 80 L 160 0" />
      <path class="v-ng-line v-ng-edge" stroke="#666666" stroke-width="1" stroke-linecap="butt" data-edge-id="edge3" d="M 160 0 L 240 80" />
    </g>
    <g class="v-ng-layer-nodes-selections" />
    <g class="v-ng-layer-nodes v-ng-graph-objects">
      <g class="v-ng-node" transform="translate(0 0)">
        <rect class="v-ng-shape-rect v-ng-node-default draggable" x="-16" y="-16" width="32" height="32" rx="6" ry="6" fill="#ffffff" stroke="#888888" stroke-width="1" />
      </g>
      <g class="v-ng-node" transform="translate(80 80)">
        <rect class="v-ng-shape-rect v-ng-node-default draggable" x="-16" y="-16" width="32" height="32" rx="6" ry="6" fill="#ffffff" stroke="#888888" stroke-width="1" />
      </g>
      <g class="v-ng-node" transform="translate(160 0)">
        <rect class="v-ng-shape-rect v-ng-node-default draggable" x="-16" y="-16" width="32" height="32" rx="6" ry="6" fill="#ffffff" stroke="#888888" stroke-width="1" />
      </g>
      <g class="v-ng-node" transform="translate(240 80)">
        <rect class="v-ng-shape-rect v-ng-node-default draggable" x="-16" y="-16" width="32" height="32" rx="6" ry="6" fill="#ffffff" stroke="#888888" stroke-width="1" />
      </g>
    </g>
    <g class="v-ng-layer">
      <circle cx="9" cy="-9" r="4" fill="#00cc00" style="pointer-events: none;" />
      <circle cx="89" cy="71" r="4" fill="#ff5555" style="pointer-events: none;" />
      <circle cx="169" cy="-9" r="4" fill="#00cc00" style="pointer-events: none;" />
      <circle cx="249" cy="71" r="4" fill="#ff5555" style="pointer-events: none;" />
    </g>
    <g class="v-ng-layer-node-labels v-ng-graph-objects">
      <g class="v-ng-node-label" transform="translate(0 0)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 1
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(80 80)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 2
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(160 0)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 3
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(240 80)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 4
        </text>
      </g>
    </g>
  </g>
</svg>