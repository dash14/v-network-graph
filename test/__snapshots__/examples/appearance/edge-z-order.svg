<svg class="v-ng-canvas show touches" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events" style="overflow: hidden; ">
  <g class="v-ng-viewport svg-pan-zoom_viewport" transform="matrix(1 0 0 1 0 0)">
    <g class="v-ng-layer-edges v-ng-graph-objects">
      <path class="v-ng-line-background selectable" stroke="transparent" stroke-width="16" fill="none" d="M 0 0 L 240 0" />
      <path class="v-ng-line-background selectable" stroke="transparent" stroke-width="16" fill="none" d="M 40 50 L 200 -50" />
      <path class="v-ng-line selectable v-ng-edge" stroke="#44cccc" stroke-width="6" stroke-linecap="butt" data-edge-id="edge2" d="M 40 50 L 200 -50" />
      <path class="v-ng-line selectable v-ng-edge" stroke="#aa8888" stroke-width="6" stroke-linecap="butt" data-edge-id="edge1" d="M 0 0 L 240 0" />
    </g>
    <g class="v-ng-layer-nodes-selections" />
    <g class="v-ng-layer-nodes v-ng-graph-objects">
      <g class="v-ng-node" transform="translate(0 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(40 50)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(240 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(200 -50)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
    </g>
    <g class="v-ng-layer-node-labels v-ng-graph-objects">
      <g class="v-ng-node-label" transform="translate(0 0)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 1
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(40 50)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 2
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(240 0)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 3
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(200 -50)">
        <text class="v-ng-text draggable" text-anchor="middle" transform="translate(0 20)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          Node 4
        </text>
      </g>
    </g>
  </g>
</svg>