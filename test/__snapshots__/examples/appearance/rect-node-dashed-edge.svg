        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 -20)" x="0" y="0" dominant-baseline="text-top" font-size="16" fill="#000000">
          N5
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(320 160)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 -20)" x="0" y="0" dominant-baseline="text-top" font-size="16" fill="#000000">
