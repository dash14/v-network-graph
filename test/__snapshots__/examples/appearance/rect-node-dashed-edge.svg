      </g>
      <g class="v-ng-node" transform="translate(0 160)">
        <rect class="v-ng-shape-rect v-ng-node-default draggable selectable" x="-16" y="-16" width="32" height="32" rx="8" ry="8" fill="#ff6f00" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(240 80)">
