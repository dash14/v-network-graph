<svg class="v-ng-canvas show touches" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events" style="overflow: hidden; ">
  <g class="v-ng-viewport svg-pan-zoom_viewport" transform="matrix(1 0 0 1 0 0)">
    <g class="v-ng-layer-edges v-ng-graph-objects">
      <line class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" x1="0" y1="0" x2="80" y2="80" />
      <line class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" x1="80" y1="80" x2="0" y2="160" />
      <line class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" x1="80" y1="80" x2="240" y2="80" />
      <line class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" x1="240" y1="80" x2="320" y2="0" />
      <line class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" x1="240" y1="80" x2="320" y2="160" />
      <line class="v-ng-line v-ng-edge" stroke="#ff6f00" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" data-edge-id="edge1" x1="0" y1="0" x2="80" y2="80" />
      <line class="v-ng-line v-ng-edge" stroke="#ff6f00" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" data-edge-id="edge2" x1="80" y1="80" x2="0" y2="160" />
      <line class="v-ng-line v-ng-edge" stroke="#ff6f00" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" data-edge-id="edge3" x1="80" y1="80" x2="240" y2="80" />
      <line class="v-ng-line v-ng-edge" stroke="#ff6f00" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" data-edge-id="edge4" x1="240" y1="80" x2="320" y2="0" />
      <line class="v-ng-line v-ng-edge" stroke="#ff6f00" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" data-edge-id="edge5" x1="240" y1="80" x2="320" y2="160" />
    </g>
    <g class="v-ng-layer-nodes-selections" />
    <g class="v-ng-layer-nodes v-ng-graph-objects">
