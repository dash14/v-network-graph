<svg class="v-ng-canvas show touches" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events" style="overflow: hidden; ">
  <g class="v-ng-viewport svg-pan-zoom_viewport" transform="matrix(1 0 0 1 0 0)">
    <g class="v-ng-layer-edges v-ng-graph-objects">
      <path class="v-ng-line-background" d="M 0 0 L 80 80" stroke="transparent" stroke-width="13" fill="none" />
      <path class="v-ng-line-background" d="M 80 80 L 0 160" stroke="transparent" stroke-width="13" fill="none" />
      <path class="v-ng-line-background" d="M 80 80 L 240 80" stroke="transparent" stroke-width="13" fill="none" />
      <path class="v-ng-line-background" d="M 240 80 L 320 0" stroke="transparent" stroke-width="13" fill="none" />
      <path class="v-ng-line-background" d="M 240 80 L 320 160" stroke="transparent" stroke-width="13" fill="none" />
      <path class="v-ng-line v-ng-edge" d="M 0 0 L 80 80" stroke="#58139c" stroke-width="3" stroke-linecap="butt" data-edge-id="edge1" />
      <path class="v-ng-line v-ng-edge" d="M 80 80 L 0 160" stroke="#58139c" stroke-width="3" stroke-linecap="butt" data-edge-id="edge2" />
      <path class="v-ng-line v-ng-edge" d="M 80 80 L 240 80" stroke="#58139c" stroke-width="3" stroke-linecap="butt" data-edge-id="edge3" />
      <path class="v-ng-line v-ng-edge" d="M 240 80 L 320 0" stroke="#58139c" stroke-width="3" stroke-linecap="butt" data-edge-id="edge4" />
      <path class="v-ng-line v-ng-edge" d="M 240 80 L 320 160" stroke="#58139c" stroke-width="3" stroke-linecap="butt" data-edge-id="edge5" />
    </g>
    <g class="v-ng-layer-nodes-selections" />
    <g class="v-ng-layer-nodes v-ng-graph-objects">
      <g class="v-ng-node" transform="translate(0 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="16" fill="#6013ad" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(80 80)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="16" fill="#6013ad" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(0 160)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="16" fill="#6013ad" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(240 80)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="16" fill="#6013ad" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(320 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="16" fill="#6013ad" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(320 160)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="16" fill="#6013ad" stroke="#000000" stroke-width="0" />
      </g>
    </g>
    <g class="v-ng-layer-node-labels v-ng-graph-objects">
      <g class="v-ng-node-label" transform="translate(0 0)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 0)" x="0" y="0" dominant-baseline="central" font-size="11" fill="#ffffff">
          N1
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(80 80)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 0)" x="0" y="0" dominant-baseline="central" font-size="11" fill="#ffffff">
          N2
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(0 160)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 0)" x="0" y="0" dominant-baseline="central" font-size="11" fill="#ffffff">
          N3
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(240 80)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 0)" x="0" y="0" dominant-baseline="central" font-size="11" fill="#ffffff">
          N4
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(320 0)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 0)" x="0" y="0" dominant-baseline="central" font-size="11" fill="#ffffff">
          N5
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(320 160)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 0)" x="0" y="0" dominant-baseline="central" font-size="11" fill="#ffffff">
          N6
        </text>
