    <g class="v-ng-layer-node-labels v-ng-graph-objects">
      <g class="v-ng-node-label" transform="translate(0 0)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 24)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
