        <circle r="20" fill="#4466cc" class="draggable selectable" />
        <text font-family="Material Icons" font-size="22" fill="#ffffff" text-anchor="middle" dominant-baseline="central" style="pointer-events: none;">
          
        </text>
      </g>
      <g class="v-ng-node" transform="translate(80 80)">
        <circle r="20" fill="#4466cc" class="draggable selectable" />
        <text font-family="Material Icons" font-size="22" fill="#ffffff" text-anchor="middle" dominant-baseline="central" style="pointer-events: none;">
          
        </text>
      </g>
      <g class="v-ng-node" transform="translate(0 160)">
        <circle r="20" fill="#4466cc" class="draggable selectable" />
        <text font-family="Material Icons" font-size="22" fill="#ffffff" text-anchor="middle" dominant-baseline="central" style="pointer-events: none;">
          
        </text>
      </g>
      <g class="v-ng-node" transform="translate(240 80)">
        <circle r="20" fill="#4466cc" class="draggable selectable" />
        <text font-family="Material Icons" font-size="22" fill="#ffffff" text-anchor="middle" dominant-baseline="central" style="pointer-events: none;">
          
        </text>
      </g>
      <g class="v-ng-node" transform="translate(320 0)">
        <circle r="20" fill="#4466cc" class="draggable selectable" />
