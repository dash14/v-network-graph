<svg class="v-ng-canvas show touches" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events" style="overflow: hidden; ">
  <g class="v-ng-viewport svg-pan-zoom_viewport" transform="matrix(1 0 0 1 0 0)">
    <g class="v-ng-layer-edges v-ng-graph-objects">
      <path class="v-ng-line-background" d="M 0 0 L 55 0" stroke="transparent" stroke-width="12" fill="none" />
      <path class="v-ng-line-background" d="M 55 0 L 180 0" stroke="transparent" stroke-width="12" fill="none" />
      <path class="v-ng-line-background" d="M 180 0 L 235 0" stroke="transparent" stroke-width="12" fill="none" />
      <path class="v-ng-line v-ng-edge" d="M 0 0 L 55 0" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge1" />
      <path class="v-ng-line v-ng-edge" d="M 55 0 L 180 0" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge2" />
      <path class="v-ng-line v-ng-edge" d="M 180 0 L 235 0" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge3" />
    </g>
    <g class="v-ng-layer-nodes-selections" />
    <g class="v-ng-layer-nodes v-ng-graph-objects">
      <g class="v-ng-node" transform="translate(0 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="24" fill="#4466cc" stroke="#324C99" stroke-width="3" />
      </g>
      <g class="v-ng-node" transform="translate(235 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="24" fill="#4466cc" stroke="#324C99" stroke-width="3" />
      </g>
      <g class="v-ng-node" transform="translate(55 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="36" fill="#44cccc" stroke="#329999" stroke-width="3" />
      </g>
      <g class="v-ng-node" transform="translate(180 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="36" fill="#44cccc" stroke="#329999" stroke-width="3" />
      </g>
    </g>
    <g class="v-ng-layer-node-labels v-ng-graph-objects">
      <g class="v-ng-node-label" transform="translate(0 0)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 28)" x="0" y="0" dominant-baseline="hanging" font-size="12" fill="#000000">
          z-index: 1
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(235 0)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 28)" x="0" y="0" dominant-baseline="hanging" font-size="12" fill="#000000">
          z-index: 1
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(55 0)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 40)" x="0" y="0" dominant-baseline="hanging" font-size="12" fill="#000000">
          z-index: 2
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(180 0)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 40)" x="0" y="0" dominant-baseline="hanging" font-size="12" fill="#000000">
          z-index: 2
        </text>
      </g>
    </g>
  </g>
</svg>