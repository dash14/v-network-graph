<svg class="v-ng-canvas show touches" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events" style="overflow: hidden; ">
  <g class="v-ng-viewport" transform="matrix(1 0 0 1 0 0)">
    <g class="v-ng-layer-edges v-ng-graph-objects">
      <path class="v-ng-line-background" stroke="transparent" stroke-width="11" fill="none" d="M 0 0 L 80 80" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="11" fill="none" d="M 80 80 L 0 160" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" d="M 80 80 L 240 80" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="11" fill="none" d="M 240 80 L 320 0" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="11" fill="none" d="M 240 80 L 320 160" />
      <path class="v-ng-line v-ng-edge" stroke="#ff00dd" stroke-width="1" stroke-linecap="butt" data-edge-id="edge1" d="M 0 0 L 80 80" />
      <path class="v-ng-line v-ng-edge" stroke="#ff00dd" stroke-width="1" stroke-linecap="butt" data-edge-id="edge2" d="M 80 80 L 0 160" />
      <path class="v-ng-line animate v-ng-edge" stroke="#ff00dd" stroke-width="2" stroke-dasharray="4" stroke-linecap="butt" data-edge-id="edge3" d="M 80 80 L 240 80" style="--animation-speed: 400;" />
      <path class="v-ng-line v-ng-edge" stroke="#ff00dd" stroke-width="1" stroke-linecap="butt" data-edge-id="edge4" d="M 240 80 L 320 0" />
      <path class="v-ng-line v-ng-edge" stroke="#ff00dd" stroke-width="1" stroke-linecap="butt" data-edge-id="edge5" d="M 240 80 L 320 160" />
    </g>
    <g class="v-ng-layer-nodes-selections" />
    <g class="v-ng-layer-nodes v-ng-graph-objects">
      <g class="v-ng-node" transform="translate(0 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="10" fill="#ffffff" stroke="#ff00dd" stroke-width="3" />
      </g>
      <g class="v-ng-node" transform="translate(80 80)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="10" fill="#ffffff" stroke="#ff00dd" stroke-width="3" />
      </g>
      <g class="v-ng-node" transform="translate(0 160)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="10" fill="#ffffff" stroke="#ff00dd" stroke-width="3" />
      </g>
      <g class="v-ng-node" transform="translate(240 80)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="10" fill="#ffffff" stroke="#ff00dd" stroke-width="3" />
      </g>
      <g class="v-ng-node" transform="translate(320 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="10" fill="#ffffff" stroke="#ff00dd" stroke-width="3" />
      </g>
      <g class="v-ng-node" transform="translate(320 160)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable selectable" cx="0" cy="0" r="10" fill="#ffffff" stroke="#ff00dd" stroke-width="3" />
      </g>
    </g>
  </g>
</svg>