        <image class="face-picture" x="-20" y="-20" width="40" height="40" xlink:href="./faces/0103755.png" clip-path="url(#faceCircle)" />
        <circle class="face-circle draggable selectable" r="20" fill="none" stroke="#808080" stroke-width="1" />
      </g>
      <g class="v-ng-node" transform="translate(320 160)">
