<svg class="v-ng-canvas show touches" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events" style="overflow: hidden; ">
  <defs>
    <clipPath id="faceCircle" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.5" />
    </clipPath>
  </defs>
  <g class="v-ng-viewport svg-pan-zoom_viewport" transform="matrix(1 0 0 1 0 0)">
    <g class="v-ng-layer-edges v-ng-graph-objects">
      <path class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" d="M 0 0 L 80 80" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" d="M 80 80 L 0 160" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" d="M 80 80 L 240 80" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" d="M 240 80 L 320 0" />
      <path class="v-ng-line-background" stroke="transparent" stroke-width="12" fill="none" d="M 240 80 L 320 160" />
      <path class="v-ng-line v-ng-edge" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge1" d="M 0 0 L 80 80" />
      <path class="v-ng-line v-ng-edge" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge2" d="M 80 80 L 0 160" />
      <path class="v-ng-line v-ng-edge" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge3" d="M 80 80 L 240 80" />
      <path class="v-ng-line v-ng-edge" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge4" d="M 240 80 L 320 0" />
      <path class="v-ng-line v-ng-edge" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge5" d="M 240 80 L 320 160" />
    </g>
    <g class="v-ng-layer-nodes-selections" />
    <g class="v-ng-layer-nodes v-ng-graph-objects">
      <g class="v-ng-node" transform="translate(0 0)">
        <circle class="face-circle draggable selectable" r="20" fill="#ffffff" />
        <image class="face-picture" x="-20" y="-20" width="40" height="40" xlink:href="./faces/0023286.png" clip-path="url(#faceCircle)" />
        <circle class="face-circle draggable selectable" r="20" fill="none" stroke="#808080" stroke-width="1" />
      </g>
      <g class="v-ng-node" transform="translate(80 80)">
        <circle class="face-circle draggable selectable" r="20" fill="#ffffff" />
        <image class="face-picture" x="-20" y="-20" width="40" height="40" xlink:href="./faces/0700202.png" clip-path="url(#faceCircle)" />
        <circle class="face-circle draggable selectable" r="20" fill="none" stroke="#808080" stroke-width="1" />
      </g>
      <g class="v-ng-node" transform="translate(0 160)">
        <circle class="face-circle draggable selectable" r="20" fill="#ffffff" />
        <image class="face-picture" x="-20" y="-20" width="40" height="40" xlink:href="./faces/0037725.png" clip-path="url(#faceCircle)" />
        <circle class="face-circle draggable selectable" r="20" fill="none" stroke="#808080" stroke-width="1" />
      </g>
      <g class="v-ng-node" transform="translate(240 80)">
        <circle class="face-circle draggable selectable" r="20" fill="#ffffff" />
        <image class="face-picture" x="-20" y="-20" width="40" height="40" xlink:href="./faces/0062138.png" clip-path="url(#faceCircle)" />
        <circle class="face-circle draggable selectable" r="20" fill="none" stroke="#808080" stroke-width="1" />
      </g>
      <g class="v-ng-node" transform="translate(320 0)">
