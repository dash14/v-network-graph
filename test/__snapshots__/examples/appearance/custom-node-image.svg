      </g>
      <g class="v-ng-node-label" transform="translate(80 80)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 24)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          User 2
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(0 160)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 24)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          User 3
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(240 80)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 24)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          User 4
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(320 0)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 24)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          User 5
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(320 160)">
        <text class="v-ng-text draggable selectable" text-anchor="middle" transform="translate(0 24)" x="0" y="0" dominant-baseline="hanging" font-size="11" fill="#000000">
          User 6
        </text>
      </g>
    </g>
  </g>
</svg>