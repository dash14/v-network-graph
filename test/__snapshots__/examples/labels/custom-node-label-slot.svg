<svg class="v-ng-canvas show touches" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events" style="overflow: hidden; ">
  <g class="v-ng-viewport svg-pan-zoom_viewport" transform="matrix(1 0 0 1 0 0)">
    <g class="v-ng-layer-edges v-ng-graph-objects">
      <path class="v-ng-line-background" d="M 0 0 L 80 80" stroke="transparent" stroke-width="12" fill="none" />
      <path class="v-ng-line-background" d="M 80 80 L 160 0" stroke="transparent" stroke-width="12" fill="none" />
      <path class="v-ng-line-background" d="M 160 0 L 240 80" stroke="transparent" stroke-width="12" fill="none" />
      <path class="v-ng-line-background" d="M 240 80 L 320 0" stroke="transparent" stroke-width="12" fill="none" />
      <path class="v-ng-line v-ng-edge" d="M 0 0 L 80 80" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge1" />
      <path class="v-ng-line v-ng-edge" d="M 80 80 L 160 0" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge2" />
      <path class="v-ng-line v-ng-edge" d="M 160 0 L 240 80" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge3" />
      <path class="v-ng-line v-ng-edge" d="M 240 80 L 320 0" stroke="#4466cc" stroke-width="2" stroke-linecap="butt" data-edge-id="edge4" />
    </g>
    <g class="v-ng-layer-nodes-selections" />
    <g class="v-ng-layer-nodes v-ng-graph-objects">
      <g class="v-ng-node" transform="translate(0 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(80 80)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(160 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(240 80)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
      <g class="v-ng-node" transform="translate(320 0)">
        <circle class="v-ng-shape-circle v-ng-node-default draggable" cx="0" cy="0" r="16" fill="#4466cc" stroke="#000000" stroke-width="0" />
      </g>
    </g>
    <g class="v-ng-layer-node-labels v-ng-graph-objects">
      <g class="v-ng-node-label" transform="translate(0 0)">
        <text x="0" y="0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#ffffff">
          node1
        </text>
        <text x="0" y="0" font-size="11" text-anchor="middle" dominant-baseline="hanging" fill="#000000" transform="translate(0 20)">
          Node 1
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(80 80)">
        <text x="0" y="0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#ffffff">
          node2
        </text>
        <text x="0" y="0" font-size="11" text-anchor="middle" dominant-baseline="hanging" fill="#000000" transform="translate(0 20)">
          Node 2
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(160 0)">
        <text x="0" y="0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#ffffff">
          node3
        </text>
        <text x="0" y="0" font-size="11" text-anchor="middle" dominant-baseline="hanging" fill="#000000" transform="translate(0 20)">
          Node 3
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(240 80)">
        <text x="0" y="0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#ffffff">
          node4
        </text>
        <text x="0" y="0" font-size="11" text-anchor="middle" dominant-baseline="hanging" fill="#000000" transform="translate(0 20)">
          Node 4
        </text>
      </g>
      <g class="v-ng-node-label" transform="translate(320 0)">
        <text x="0" y="0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#ffffff">
          node5
        </text>
        <text x="0" y="0" font-size="11" text-anchor="middle" dominant-baseline="hanging" fill="#000000" transform="translate(0 20)">
          Node 5
        </text>
      </g>
    </g>
  </g>
</svg>